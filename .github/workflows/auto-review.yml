name: auto-review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m compileall -q archive_toolkit.py tests
      - name: Test
        run: python -m pytest tests
